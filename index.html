<script>
(function(){
  document.addEventListener("contextmenu",e=>e.preventDefault());
  document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
  /* strip angle brackets from any text field — defense in depth */
  document.addEventListener("input",e=>{const t=e.target;if(t&&t.matches&&t.matches(".input,.textarea")&&/[<>]/.test(t.value)){t.value=t.value.replace(/[<>]/g,"")}});

  /* anti-tamper: detect devtools → trap, then shut the whole site down */
  (function(){
    let hits=0, warm=0, dead=false;
    const probe=new Image();
    Object.defineProperty(probe,"id",{get(){hits++}});
    function nuke(){
      if(dead)return;dead=true;
      try{window.stop()}catch(e){}
      try{document.documentElement.innerHTML=""}catch(e){}
      try{window.close()}catch(e){}
      setTimeout(()=>{try{location.replace("about:blank")}catch(e){}},150);
    }
    setInterval(()=>{
      try{console.log("%c ",probe)}catch(e){}
      setTimeout(()=>{
        if(hits>0){
          if(!dead)(function loop(){debugger;requestAnimationFrame(loop)})();
          if(++warm>=2)nuke();
        }
        hits=0;
      },300);
    },2000);
  })();

  document.addEventListener("keydown",function(e){
    if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key.toUpperCase()))||(e.ctrlKey&&["U","S"].includes(e.key.toUpperCase()))){e.preventDefault();}
  });
})();
window.addEventListener("error",function(e){
  var d=document.getElementById("fatalerr");
  if(!d){d=document.createElement("div");d.id="fatalerr";
   d.style.cssText="position:fixed;inset:0;z-index:999;background:#070708;color:#f4f4f5;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:monospace";
   document.body.appendChild(d)}
  d.innerHTML='<div style="max-width:640px;border:1px solid #e11d2e;border-radius:6px;padding:1.5rem;background:#0d0d10"><div style="color:#e11d2e;font-weight:bold;letter-spacing:.2em;font-size:.7rem">// RUNTIME FAULT</div><div style="margin-top:.8rem;font-size:.9rem">'+(e.message||"Unknown")+'</div></div>';
});
</script>
<style>
/* styles */
:root{
  --red:#e11d2e; --red2:#ff2438;
  --red-soft:rgba(225,29,46,.12); --red-line:rgba(225,29,46,.5);
  --bg:#0b0e15; --bg2:#0e121b; --panel:#12161f; --panel2:#171c27;
  --line:#242b3a; --line2:#333d50;
  --txt:#f2f4f8; --mut:#9aa3b5; --dim:#5d6577;
  --ok:#2fbf71; --warn:#f0a72e; --bad:#e5484d;
  --cool:#5b7cfa;
  --fd:'Space Grotesk',sans-serif;
  --shadow-red:0 14px 44px rgba(225,29,46,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.dfont{font-family:var(--fd)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.lucide{width:1em;height:1em;stroke-width:2;vertical-align:-.12em;color:var(--red2)}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--red)}

/* ——— ambient: ash grid + ember glow + scan ——— */
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 680px at 82% -12%,rgba(91,124,250,.08),transparent 60%),radial-gradient(980px 620px at 8% 6%,rgba(225,29,46,.1),transparent 58%),var(--bg)}
.amb .gridlayer{position:absolute;inset:0;background-image:radial-gradient(rgba(90,101,119,.5) 1px,transparent 1.4px);background-size:26px 26px;opacity:.28;mask-image:radial-gradient(ellipse 92% 72% at 50% 0%,#000 12%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 92% 72% at 50% 0%,#000 12%,transparent 80%)}
.amb .ember{position:absolute;width:680px;height:680px;top:-300px;right:-140px;background:radial-gradient(circle,rgba(225,29,46,.09),transparent 62%);filter:blur(6px)}
.amb .ember2{position:absolute;width:640px;height:640px;bottom:-320px;left:-180px;background:radial-gradient(circle,rgba(91,124,250,.08),transparent 62%);filter:blur(6px)}
.amb .scan{position:absolute;left:0;right:0;height:160px;top:-160px;background:linear-gradient(to bottom,transparent,rgba(242,244,248,.03),transparent);animation:scan 12s linear infinite}
@keyframes scan{to{top:110%}}
.embers{position:fixed;inset:0;z-index:-1;pointer-events:none}
.embers i{position:absolute;bottom:-8px;width:2px;height:2px;border-radius:50%;background:var(--red2);opacity:0;animation:rise linear infinite;box-shadow:0 0 4px var(--red2)}
.embers i:nth-child(3n){background:var(--cool);box-shadow:0 0 4px var(--cool)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.4}100%{transform:translateY(-105vh);opacity:0}}

/* ——— boot screen ——— */
#boot{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3rem;transition:opacity .55s ease}
#boot.done{opacity:0;pointer-events:none}
#boot .blogo{width:20px;height:20px;border-radius:5px;overflow:hidden;border:1px solid var(--line2);animation:bootpulse 1.7s ease-in-out infinite}
#boot .blogo img{width:100%;height:100%;object-fit:cover;image-rendering:-webkit-optimize-contrast}
.logo-chip img{image-rendering:-webkit-optimize-contrast}
@keyframes bootpulse{0%,100%{box-shadow:0 0 28px rgba(225,29,46,.25)}50%{box-shadow:0 0 62px rgba(225,29,46,.55)}}
#boot .bar{width:210px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 10px var(--red);transition:width .3s ease}
#boot .txt{font-family:var(--fd);font-size:.62rem;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}

/* ——— buttons ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-size:.76rem;padding:.8rem 1.5rem;border-radius:10px;border:1px solid transparent;transition:all .18s ease;user-select:none;text-decoration:none;white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:translateY(1px)}
.btn .lucide{width:1.05em;height:1.05em}
.btn-p .lucide{color:#c8c8d0}
.btn-g .lucide,.btn-ghost .lucide{color:var(--red2)}
.btn-p{background:var(--red);color:#fff;box-shadow:var(--shadow-red),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-p::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);transition:left .5s}
.btn-p:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 18px 50px rgba(225,29,46,.4)}
.btn-p:hover::after{left:130%}
.btn-g{background:transparent;color:var(--txt);border-color:var(--line2)}
.btn-g:hover{border-color:var(--red);color:var(--red2);background:var(--red-soft)}
.btn-ghost{background:#1a1a20;color:var(--txt);border-color:var(--line2)}
.btn-ghost:hover{border-color:var(--red-line);box-shadow:var(--shadow-red);transform:translateY(-2px)}
.btn-sm{padding:.5rem .95rem;font-size:.66rem}

/* ——— panels ——— */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}
.panel-cut{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));border:none;box-shadow:0 0 0 1px var(--line)}
.glowcard{box-shadow:0 10px 34px rgba(0,0,0,.55);transition:transform .22s,box-shadow .22s,border-color .22s}
.glowcard:hover{transform:translateY(-5px);border-color:var(--red-line);box-shadow:var(--shadow-red),0 18px 44px rgba(0,0,0,.6)}
.kicker{font-family:var(--fd);font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--red2);display:flex;align-items:center;gap:.65rem}
.kicker::before{content:"";width:26px;height:1px;background:var(--red)}
.seclabel{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--red2)}
.hazard{background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#0d0d10 10px 20px);height:4px;border-radius:2px;opacity:.8}
.input,.select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:.7rem .9rem;font-size:.9rem;font-family:'IBM Plex Sans',sans-serif;transition:border-color .15s,box-shadow .15s;outline:none}
.input:focus,.select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.input.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.15)}
.label{display:block;font-family:var(--fd);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:.4rem}
.errtxt{color:var(--bad);font-size:.7rem;margin-top:.3rem;display:none}
.errtxt.show{display:block}

.pill{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--fd);font-size:.6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:.28rem .62rem;border-radius:7px;border:1px solid}
.pill-red{color:var(--red2);border-color:var(--red-line);background:var(--red-soft)}
.pill-ok{color:var(--ok);border-color:rgba(47,191,113,.4);background:rgba(47,191,113,.08)}
.pill-off{color:var(--dim);border-color:var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pulse-dot{position:relative}
.pulse-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}

/* ——— nav ——— */
.nav{position:sticky;top:0;z-index:60;background:rgba(11,14,21,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav a.nl{font-family:var(--fd);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:.5rem .15rem;border-bottom:2px solid transparent;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem}
.nav a.nl .lucide{width:1.1em;height:1.1em}
.nav a.nl:hover{color:var(--txt)}
.nav a.nl.on{color:var(--red2);border-bottom-color:var(--red)}
.logo-chip{width:14px;height:14px;border-radius:5px;overflow:hidden;border:1px solid var(--line2);background:#0d0d10;flex:none;box-shadow:0 0 8px rgba(225,29,46,.2)}
.logo-chip img{width:100%;height:100%;object-fit:cover}

/* ——— centered nav logo: bare image, soft red glow ——— */
.navlogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
.navlogo img{height:36px;width:36px;object-fit:cover;display:block;image-rendering:-webkit-optimize-contrast;filter:drop-shadow(0 0 9px rgba(225,29,46,.55));transition:filter .25s ease,transform .25s ease}
.navlogo:hover img{filter:drop-shadow(0 0 16px rgba(225,29,46,.85));transform:scale(1.07)}
@media(max-width:640px){.navlogo img{height:28px}}

/* ——— bottom dock nav ——— */
body.hasdock{padding-bottom:92px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:70;display:flex;gap:2px;padding:7px;background:rgba(14,18,27,.92);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 34px rgba(225,29,46,.18);animation:dockup .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dockup{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
.dock a.dk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:.6rem 1.15rem;border-radius:12px;text-decoration:none;color:var(--dim);font-family:var(--fd);font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;transition:all .18s ease}
.dock a.dk .lucide{width:1.3rem;height:1.3rem;color:inherit;transition:transform .18s}
.dock a.dk:hover{color:var(--txt);background:var(--panel2)}
.dock a.dk:hover .lucide{transform:translateY(-2px)}
.dock a.dk.on{color:var(--red2);background:var(--red-soft)}
.dock a.dk.on .lucide{filter:drop-shadow(0 0 6px rgba(225,29,46,.8))}
.dock a.dk.on::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:var(--red);box-shadow:0 0 12px var(--red)}
@media(max-width:420px){.dock a.dk{padding:.55rem .72rem}}
@media(max-width:380px){.dock a.dk span{display:none}.dock a.dk{padding:.6rem .8rem}.dock a.dk .lucide{width:1.45rem;height:1.45rem}}

/* ——— HUD showcase ——— */
.hudframe{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#0a0a0c;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.hudframe img{width:100%;display:block}

/* ——— splash stage: the panel itself is the hero ——— */
.stage{position:relative;min-height:min(80vh,660px);overflow:hidden;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;filter:saturate(.95) contrast(1.06);transform:scale(1.02);transition:transform 8s ease,opacity 1s ease}
.stage:hover .bgimg{transform:scale(1.06);opacity:.5}
.stage .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,8,.96) 0%,rgba(7,7,8,.35) 42%,rgba(7,7,8,.7) 100%)}
.stage .edge{position:absolute;inset:14px;border:1px solid rgba(225,29,46,.22);border-radius:6px;pointer-events:none}
.stage .topbar{position:relative;z-index:2;display:flex;align-items:center;gap:1.2rem;padding:1.1rem 1.6rem;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.16em;color:var(--mut)}
.stage .topbar .live{color:var(--red2);display:flex;align-items:center;gap:.45rem}
.stage .topbar .sep{color:var(--line2)}
.stage .vtext{position:absolute;right:1.4rem;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.5em;color:var(--dim);z-index:2}
.stage .floor{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:2rem;padding:0 1.6rem 2.2rem}
.stage .floor h1{font-family:'Black Ops One',var(--fd);font-weight:400;font-size:clamp(3rem,10vw,7.5rem);line-height:.92;letter-spacing:.01em;color:var(--txt);text-shadow:4px 4px 0 rgba(225,29,46,.9),8px 8px 0 rgba(225,29,46,.3),0 0 60px rgba(225,29,46,.35)}
.stage .floor h1 .tm{color:var(--red2);text-shadow:4px 4px 0 #4a0810,8px 8px 0 rgba(74,8,16,.4)}
.stage .floor .sub{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.22em;color:var(--mut);margin-top:.9rem}
.stage .cmds{display:flex;flex-direction:column;gap:.7rem;align-items:flex-end}
.cmdbtn{display:flex;align-items:center;gap:.7rem;font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.06em;color:var(--txt);background:rgba(10,10,13,.82);border:1px solid var(--line2);border-radius:5px;padding:.8rem 1.2rem;text-decoration:none;transition:all .2s ease;backdrop-filter:blur(4px)}
.cmdbtn .pr{color:var(--red2)}
.cmdbtn:hover{border-color:var(--red-line);background:rgba(23,10,13,.9);transform:translateX(-5px);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 30px rgba(225,29,46,.2)}
.cmdbtn .lucide{color:var(--red2)}
/* ——— human-crafted bits ——— */
.stamp{display:inline-block;font-family:var(--fd);font-size:.6rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--red2);border:1.5px solid var(--red-line);padding:.4rem .8rem;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(225,29,46,.25)}


.splitbar{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media(max-width:768px){.splitbar{grid-template-columns:1fr}}
.splitbar .half{padding:2.4rem 2rem;position:relative;transition:background .2s}
.splitbar .half+.half{border-left:1px solid var(--line)}
@media(max-width:768px){.splitbar .half+.half{border-left:none;border-top:1px solid var(--line)}}
.splitbar .half.free:hover{background:#101013}
.splitbar .half.prem{background:linear-gradient(135deg,#170a0d,#0d0d10)}
.splitbar .half.prem:hover{background:linear-gradient(135deg,#1d0c10,#0d0d10)}
.splitbar .num{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.2em}
.specwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.specwrap .shead{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1rem;background:#0c0c0f;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.14em;color:var(--mut)}
.specwrap .scols{display:grid;grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.specwrap .scols{grid-template-columns:1fr}}
.specwrap .scol{padding:1rem;border-right:1px solid var(--line)}
.specwrap .scol:last-child{border-right:none}
@media(max-width:860px){.specwrap .scol{border-right:none;border-bottom:1px solid var(--line)}}
.specwrap .scol h4{font-family:var(--fd);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
.specwrap .srow{font-family:'IBM Plex Mono',monospace;font-size:.74rem;padding:.28rem 0;color:var(--mut);display:flex;gap:.5rem;transition:color .12s,transform .12s}
.specwrap .srow:hover{color:var(--txt);transform:translateX(3px)}
.specwrap .srow .p{color:var(--red2)}
.receipts{font-family:'IBM Plex Mono',monospace;font-size:.68rem}
.note-card{background:#0c0c0f;border:1px solid var(--line2);border-left:3px solid var(--red);border-radius:12px;padding:1.3rem 1.4rem;position:relative}
.note-card .sig{font-style:italic;color:var(--red2);font-size:.85rem;margin-top:.8rem}
/* ——— sentinel / anti-spam ——— */
.hp{position:absolute;left:-9999px;top:-9999px;opacity:0;height:0;width:0;tab-index:-1;pointer-events:none}
.banmark{font-family:'Black Ops One',var(--fd);font-size:clamp(2.4rem,8vw,5rem);color:var(--red2);letter-spacing:.02em;text-shadow:3px 3px 0 #4a0810,6px 6px 0 rgba(74,8,16,.4),0 0 60px rgba(225,29,46,.5)}
.faq2 .q{font-size:.92rem}
/* ——— changelog timeline ——— */
.clog{position:relative;padding-left:1.6rem}
.clog::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.clog .row{position:relative;padding:.55rem 0}
.clog .row::before{content:"";position:absolute;left:-1.6rem;top:1.05rem;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--red);box-shadow:0 0 10px rgba(225,29,46,.6)}

/* ——— live Discord check: exists + human, not a bot ——— */
const KNOWN_BOTS=["mee6","dyno","carl-bot","carlbot","probot","wick","mudae","groovy","rythm","fredboat","tickettool","statbot","yagpdb","doublecounter","captcha.bot","janitorbot","dank-memer","epicbot","vexera"];
function looksBot(n){
  const s=n.toLowerCase().replace(/#.*$/,"");
  if(KNOWN_BOTS.includes(s))return true;
  if(/(^|[_\-.])bots?([_\-.]|$)/.test(s))return true;   /* name itself says bot */
  if(/#0{4}$/.test(n))return true;                       /* legacy bot discriminator */
  return false;
}
async function checkDiscord(name){
  const clean=name.replace(/#.*$/,"").toLowerCase();
  /* Discord's own Pomelo availability API — live from the user's browser.
     Proxies are deliberately NOT used: Discord 403s datacenter IPs. */
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r=await fetch("https://discord.com/api/v9/unique-username/username-attempt-unauthed",{
      method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:clean})
    });
    clearTimeout(timer);
    if(r.status===429||r.status===403)return looksBot(clean)?"bot":"unknown"; /* rate-limit / VPN IP */
    if(!r.ok)return looksBot(clean)?"bot":"unknown";
    const j=await r.json();
    if(typeof j.taken==="boolean"){
      if(!j.taken)return "free";
      return looksBot(clean)?"bot":"exists";
    }
    return looksBot(clean)?"bot":"unknown";
  }catch(e){clearTimeout(timer);return looksBot(clean)?"bot":"unknown"}
}

}

    else if(st==="exists"){setErr("f_discord",false)}
  });
});

/* delivery alerts — real OS notification the moment an order is approved */
function askNotify(){
  if(!("Notification" in window))return toast("This browser can't show alerts","warn");
  if(Notification.permission==="granted")return toast("Alerts already on","ok");
  Notification.requestPermission().then(p=>toast(p==="granted"?"Alerts enabled — you'll know the moment your key is ready":"Alerts blocked in browser settings",p==="granted"?"ok":"warn"));
}
function notifyIfApproved(){
  const u=userSes();
  if(!u||!("Notification" in window)||Notification.permission!=="granted")return;
  const me=u.discord.toLowerCase();
  let seen;try{seen=JSON.parse(localStorage.getItem("dt_seen")||"{}")}catch(e){seen={}}
  let changed=false;
  db.orders.forEach(o=>{
    if((o.discord||"").toLowerCase()===me&&o.status==="approved"&&seen[o.id]!=="approved"){
      seen[o.id]="approved";changed=true;
      try{new Notification("DEMON TEAM — key ready",{body:"Order #"+o.id+" approved. Your key is in your Discord DMs now.",icon:LOGO,tag:"dt-"+o.id})}catch(e){}
      toast("Order #"+o.id+" approved — check your DMs","ok");
    }
  });
  if(changed)localStorage.setItem("dt_seen",JSON.stringify(seen));
}

/* ——— boot gate: nothing shows until content + images are ready ——— */
(function(){
  const b=$("#boot");if(!b)return;
  const bar=$("#bootbar"),txt=$("#boottxt");
  const imgs=[...document.images];
  let done=0,total=Math.max(imgs.length,1),finished=false;
  const tick=()=>{done++;bar.style.width=Math.min(100,Math.round(done/total*100))+"%";if(done>=total)finish()};
  function finish(){
    if(finished)return;finished=true;
    bar.style.width="100%";txt.textContent="Ready";
    setTimeout(()=>{b.classList.add("done");setTimeout(()=>b.remove(),650)},350);
  }
  imgs.forEach(im=>{
    if(im.complete)tick();
    else{im.addEventListener("load",tick,{once:true});im.addEventListener("error",tick,{once:true})}
  });
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!finished)txt.textContent="Almost there…"});
  window.addEventListener("load",()=>setTimeout(finish,250));
  setTimeout(finish,5000); /* safety net — never trap the user */
})();
